<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Icono principal solicitado -->
    <link rel="icon" type="image/png" href="/sandeco.png" />
    <link rel="apple-touch-icon" href="/sandeco.png" />
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#01050a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sandeco Ball" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sandeco ball ⚪ | Juego de Supervivencia</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #01050a;
        overflow: hidden;
        touch-action: none;
      }
      #root {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Registro del Service Worker para permitir la instalación -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registrado con éxito');
          }).catch(err => {
            console.log('Error al registrar SW', err);
          });
        });
      }
    </script>
  </body>
</html>
